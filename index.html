    -->
    <script>

        function inject(src) {
          var s = document.createElement('script');
          s.async = true;

          inject('https://www.googletagmanager.com/gtag/js?id=G-697RT52S8Y');

          fbq('init', '1214375087525107');

        var events = ['pointerdown', 'keydown', 'touchstart', 'scroll'];
        function cleanup() {
          events.forEach(function (ev) {
            window.removeEventListener(ev, loadAnalytics, { passive: true, capture: true });
          });
        }
        events.forEach(function (ev) {
          window.addEventListener(ev, loadAnalytics, { passive: true, capture: true, once: true });
        });
        // Idle fallback (Chromium/Firefox) so bots and passive visitors still fire analytics.
        var idleHandle;
        function scheduleIdle() {
          if ('requestIdleCallback' in window) {
            idleHandle = window.requestIdleCallback(loadAnalytics, { timeout: 7000 });
          } else {
            idleHandle = setTimeout(loadAnalytics, 5000);
          }
        }
        if (document.readyState === 'complete') {
          scheduleIdle();
        } else {
          window.addEventListener('load', scheduleIdle, { once: true });
        }
      })();
