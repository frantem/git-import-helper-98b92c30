<script>
(function(){
  const LOOP = 6.0;
  const stage = document.getElementById('stage');
  const panel = document.getElementById('panel');
  const T = document.getElementById('T'), Rw = document.getElementById('Rw'), R = document.getElementById('R');
  const cur = document.getElementById('cur'), rip = document.getElementById('rip'), done = document.getElementById('done');

  const ease = t => { t = Math.max(0, Math.min(1, t)); return t*t*(3-2*t); };
  const lerp = (a,b,t) => a + (b-a)*t;
  const PANEL = {x:15, y:10};

  // третий шаблон «Доступно для заказа» при прокрутке -250
  const TAP = {x: PANEL.x + 89, y: PANEL.y + 240};

  function fit(){
    const r = document.getElementById('card').getBoundingClientRect();
    stage.style.transform = 'translate(-50%,-50%) scale(' + Math.min(r.width/370, r.height/320) + ')';
  }
  fit(); window.addEventListener('resize', fit);

  function drawFrame(time){
    const t = ((time % LOOP) + LOOP) % LOOP;

    const inP  = t < 0.30 ? ease(t/0.30) : 1;
    const outP = t >= 5.45 ? ease((t-5.45)/0.35) : 0;
    panel.style.opacity = inP * (1 - outP);

    // появление результата
    const toR = t >= 1.92 ? ease((t-1.92)/0.40) : 0;
    Rw.style.transform = 'translateY(' + (300 * (1 - toR)) + 'px)';
    T.style.opacity = 1;

    // прокрутка готовой картинки
    const sc = t >= 3.05 ? ease((t-3.05)/1.55) : 0;
    R.style.transform = 'translateY(' + (-185 * sc) + 'px)';

    // бейдж «готово»
    const dn = t >= 4.62 ? Math.min(1,(t-4.62)/0.25) : 0;
    done.style.opacity = dn;
    done.style.transform = 'translate(-50%,' + (10 - 10*dn) + 'px)';

    // курсор
    let cx = TAP.x, cy = TAP.y, show = 0, press = 0;
    if (t >= 0.60 && t < 1.75){
      const p = ease((t-0.60)/0.85);
      cx = lerp(TAP.x + 62, TAP.x, p); cy = lerp(TAP.y + 74, TAP.y, p);
      show = Math.min(1,(t-0.60)/0.25);
    } else if (t >= 1.75 && t < 2.20){
      show = 1; press = t < 1.86 ? (t-1.75)/0.11 : Math.max(0,1-(t-1.86)/0.2);
    }
    cur.style.left = (cx - 11) + 'px';
    cur.style.top  = (cy - 11) + 'px';
    cur.style.opacity = show;
    cur.style.transform = 'scale(' + (1 - 0.2*press) + ')';

    // волна
    if (t >= 1.75 && t < 2.20){
      const r = (t-1.75)/0.45;
      rip.style.left = (TAP.x - 15) + 'px'; rip.style.top = (TAP.y - 15) + 'px';
      rip.style.transform = 'scale(' + (0.5 + r*2.0) + ')';
      rip.style.opacity = 0.55 * (1-r);
    } else rip.style.opacity = 0;
  }

  window.drawFrame = drawFrame;
  let start = null, running = true;
  window.stopLoop = () => { running = false; };
  function loop(ts){
    if (!running) return;
    if (start === null) start = ts;
    drawFrame((ts - start)/1000);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
