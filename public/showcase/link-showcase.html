           transform:translateY(0);opacity:0}

  #bar{position:absolute;left:0;top:0;height:3px;width:0;background:#E23B3B;opacity:0;z-index:11}

  #cur{position:absolute;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.35);
       border:1px solid rgba(255,255,255,.85);box-shadow:0 4px 14px rgba(40,36,28,.22);
       backdrop-filter:blur(2px);z-index:9;opacity:0;pointer-events:none}
  #cur:after{content:'';position:absolute;inset:8px;border-radius:50%;background:rgba(80,76,66,.38)}
  #rip{position:absolute;width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(43,86,200,.55);
       opacity:0;z-index:8;pointer-events:none}

<body>
<div id="card">
  <div id="stage">
    <div class="panel">
      <div id="shotA"></div>
      <div id="scrollB"></div>
      <div id="bar"></div>
    </div>
    <div id="rip"></div>
    <div id="cur"></div>
  </div>
</div>

<script>
(function(){
  const LOOP = 8.0;
  const stage = document.getElementById('stage');
  const A = document.getElementById('shotA');
  const B = document.getElementById('scrollB');
  const cur = document.getElementById('cur');
  const rip = document.getElementById('rip');
  const bar = document.getElementById('bar');

  const ease = t => { t = Math.max(0, Math.min(1, t)); return t*t*(3-2*t); };
  const lerp = (a,b,t) => a + (b-a)*t;

  // координаты в сцене 548×342
  const PANEL = {x:15, y:10};
  // ссылка в шапке профиля (внутри скриншота 680×599 → карточка 340×300)
  const K = 340/1170;                                   // скриншот → карточка
  const LINK = {x: PANEL.x + 300, y: PANEL.y + 246};           // правый край строки со ссылкой
  const BTN  = {x: PANEL.x + 122, y: PANEL.y + (591 - 330)};     // «В корзину» при прокрутке -330

  function fit(){
    const r = document.getElementById('card').getBoundingClientRect();
    const s = Math.min(r.width / 370, r.height / 320);
    stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }
  fit();
  window.addEventListener('resize', fit);

  function drawFrame(time){
    const t = ((time % LOOP) + LOOP) % LOOP;

    // ---- профиль → сайт ----
    const out1 = t >= 1.62 ? ease((t - 1.62) / 0.20) : 0;
    const in2  = t >= 1.80 ? ease((t - 1.80) / 0.26) : 0;
    const back = t >= 7.00 ? ease((t - 7.00) / 0.45) : 0;

    A.style.opacity = t >= 7.0 ? back : (1 - out1);
    B.style.opacity = t >= 7.0 ? (1 - back) : in2;

    // ---- прокрутка сайта ----
    const sc = t >= 3.10 ? ease((t - 3.10) / 1.50) : 0;
    B.style.transform = 'translateY(' + (-330 * sc) + 'px)';

    // ---- курсор: к ссылке ----
    let p = 0, show = 0, press = 0, cx, cy;
    if (t >= 0.55 && t < 1.50){ p = ease((t-0.55)/0.95); show = Math.min(1,(t-0.55)/0.25); }
    else if (t >= 1.50 && t < 1.85){ p = 1; show = 1;
      press = t < 1.63 ? (t-1.50)/0.13 : Math.max(0, 1-(t-1.63)/0.22); }

    if (t < 2.10){
      cx = lerp(LINK.x + 70, LINK.x, p); cy = lerp(LINK.y + 80, LINK.y, p);
    } else {
      // ---- курсор: к кнопке «В корзину» ----
      let p2 = 0;
      if (t >= 4.60 && t < 5.50){ p2 = ease((t-4.60)/0.90); show = Math.min(1,(t-4.60)/0.3); }
      if (t >= 5.50 && t < 6.90){ p2 = 1; show = 1;
        press = t < 5.65 ? (t-5.50)/0.15 : Math.max(0, 1-(t-5.65)/0.30); }
      if (t >= 6.60) show = Math.max(0, 1-(t-6.60)/0.3);
      cx = lerp(BTN.x - 40, BTN.x, p2); cy = lerp(BTN.y - 45, BTN.y, p2);
    }

    cur.style.left = (cx - 11) + 'px';
    cur.style.top  = (cy - 11) + 'px';
    cur.style.opacity = show;
    cur.style.transform = 'scale(' + (1 - 0.2*press) + ')';

    // ---- волна нажатия ----
    let rt = -1;
    if (t >= 1.50 && t < 2.02) rt = (t-1.50)/0.52;
    if (t >= 5.50 && t < 6.02) rt = (t-5.50)/0.52;
    if (rt >= 0){
      const tp = t < 3.0 ? LINK : BTN;
      rip.style.left = (tp.x - 15) + 'px';
      rip.style.top  = (tp.y - 15) + 'px';
      rip.style.transform = 'scale(' + (0.5 + rt*2.0) + ')';
      rip.style.opacity = 0.5 * (1-rt);
    } else rip.style.opacity = 0;

    // ---- полоска загрузки ----
    if (t >= 1.60 && t < 1.86){ bar.style.opacity = 1; bar.style.width = (ease((t-1.60)/0.26)*100)+'%'; }
    else if (t >= 1.86 && t < 2.06){ bar.style.opacity = 1 - (t-1.86)/0.20; bar.style.width='100%'; }
    else { bar.style.opacity = 0; bar.style.width = '0%'; }
  }

  window.drawFrame = drawFrame;
  let start = null, running = true;
  window.stopLoop = () => { running = false; };
  function loop(ts){
    if (!running) return;
    if (start === null) start = ts;
    drawFrame((ts - start) / 1000);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
