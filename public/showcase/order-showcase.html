  #Cw{position:absolute;inset:0;overflow:hidden;opacity:0;transform:translateY(90px);z-index:3}

  /* ---------- экран «заказ оформлен» ---------- */
  #ok{position:absolute;inset:0;z-index:4;background:var(--green);color:#fff;display:flex;flex-direction:column;
      align-items:center;justify-content:center;text-align:center;opacity:0;padding:22px 20px}
  #ok .ring{width:66px;height:66px;border-radius:50%;background:var(--lime);display:flex;align-items:center;
            justify-content:center;margin-bottom:16px;box-shadow:0 10px 24px rgba(0,0,0,.22)}
  #ok .ring svg{width:30px;height:30px}
  #ok h2{font-size:19px;font-weight:800;letter-spacing:-.3px}
  #ok .sum{font-size:13px;font-weight:700;color:var(--lime);margin-top:7px}
  #ok p{font-size:11.5px;line-height:1.5;color:rgba(255,255,255,.72);margin-top:9px;max-width:240px}
  #ok .btn{position:absolute;left:20px;right:20px;bottom:18px;background:var(--lime);color:#1A2410;
           font-size:12.5px;font-weight:700;text-align:center;padding:11px;border-radius:11px}

  #bar{position:absolute;left:0;top:0;height:3px;width:0;background:#E23B3B;opacity:0;z-index:11}
  #cur{position:absolute;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.38);
       border:1px solid rgba(255,255,255,.85);box-shadow:0 4px 14px rgba(40,36,28,.22);
       backdrop-filter:blur(2px);z-index:9;opacity:0;pointer-events:none}
  #cur:after{content:'';position:absolute;inset:8px;border-radius:50%;background:rgba(80,76,66,.4)}
  #rip{position:absolute;width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);
       opacity:0;z-index:8;pointer-events:none}
</style>
</head>
<body>
<div id="card">
  <div id="stage">
    <div class="panel" id="panel">
      <div class="shot" id="A"></div>
      <div id="Bw"><div class="shot" id="B"></div></div>
      <div id="Cw"><div class="shot" id="C"></div></div>
      <div id="ok">
        <div class="ring">
          <svg viewBox="0 0 24 24" fill="none" stroke="#234837" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12.5l5 5L20 6.5"/>
          </svg>
        </div>
        <h2>Заказ оформлен</h2>
        <div class="sum">30,75 BYN</div>
        <p>Своё Подворье получил заказ и свяжется с вами для подтверждения</p>
        <div class="btn">Хорошо</div>
      </div>
      <div id="bar"></div>
    </div>
    <div id="rip"></div>
    <div id="cur"></div>
  </div>
</div>

<script>
(function(){
  const LOOP = 8.0;
  const stage = document.getElementById('stage');
  const panel = document.getElementById('panel');
  const A = document.getElementById('A'), Bw = document.getElementById('Bw'), Cw = document.getElementById('Cw'), C = document.getElementById('C');
  const ok = document.getElementById('ok');
  const cur = document.getElementById('cur'), rip = document.getElementById('rip'), bar = document.getElementById('bar');

  const ease = t => { t = Math.max(0, Math.min(1, t)); return t*t*(3-2*t); };
  const lerp = (a,b,t) => a + (b-a)*t;
  const PANEL = {x:15, y:10};

  // точки нажатия в координатах сцены
  const P_CART   = {x: PANEL.x + 141, y: PANEL.y + 275};  // «В корзину» Сулугуни (слой A)
  const P_BAR    = {x: PANEL.x + 196, y: PANEL.y + 265};  // панель «Оформить заказ» (слой B)
  const P_CONFIRM= {x: PANEL.x + 296, y: PANEL.y + 236};  // «Подтвердить заказ» (слой C)

  function fit(){
    const r = document.getElementById('card').getBoundingClientRect();
    const s = Math.min(r.width / 370, r.height / 320);
    stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }
  fit(); window.addEventListener('resize', fit);

  function drawFrame(time){
    const t = ((time % LOOP) + LOOP) % LOOP;

    // ---- состояния слоёв ----
    const toB = t >= 1.62 ? ease((t - 1.62) / 0.34) : 0;
    const toC = t >= 3.10 ? ease((t - 3.10) / 0.30) : 0;
    const toOk = t >= 5.75 ? ease((t - 5.75) / 0.28) : 0;

    // сброс цикла — мягкое растворение карточки в фоне
    const fadeOut = t >= 7.45 ? ease((t - 7.45) / 0.35) : 0;
    const fadeIn  = t < 0.30 ? ease(t / 0.30) : 1;
    panel.style.opacity = (1 - fadeOut) * fadeIn;

    A.style.opacity = 1;
    Bw.style.opacity = 1;
    Bw.style.transform = 'translateY(' + (300 * (1 - toB)) + 'px)';
    Cw.style.opacity = Math.max(0, toC * (1 - toOk));
    ok.style.opacity = Math.max(0, toOk);

    A.style.transform = 'translateY(-260px)';
    // лист оформления поднимается снизу
    const sheetUp = t >= 3.05 ? ease((t - 3.05) / 0.40) : 0;
    Cw.style.transform = 'translateY(' + ((1 - sheetUp) * 90) + 'px)';

    // прокрутка внутри листа к кнопке «Подтвердить»
    const sc = t >= 3.75 ? ease((t - 3.75) / 1.10) : 0;
    C.style.transform = 'translateY(' + (-382 * sc) + 'px)';

    // ---- курсор ----
    let cx, cy, show = 0, press = 0;
    if (t < 1.66){
      let p = 0;
      if (t >= 0.85) { p = ease((t - 0.85) / 0.65); show = Math.min(1, (t - 0.85) / 0.25); }
      if (t >= 1.50) { press = t < 1.62 ? (t-1.50)/0.12 : Math.max(0, 1-(t-1.62)/0.2); show = 1; }
      cx = lerp(P_CART.x - 46, P_CART.x, p); cy = lerp(P_CART.y - 40, P_CART.y, p);
    } else if (t < 3.05){
      let p = 0;
      if (t >= 2.20) { p = ease((t - 2.20) / 0.55); show = Math.min(1, (t - 2.20) / 0.25); }
      if (t >= 2.85) { press = t < 2.97 ? (t-2.85)/0.12 : Math.max(0, 1-(t-2.97)/0.2); show = 1; }
      cx = lerp(P_CART.x + 30, P_BAR.x, p); cy = lerp(P_CART.y + 10, P_BAR.y, p);
    } else if (t < 5.75){
      let p = 0;
      if (t >= 4.95) { p = ease((t - 4.95) / 0.55); show = Math.min(1, (t - 4.95) / 0.25); }
      if (t >= 5.55) { press = t < 5.67 ? (t-5.55)/0.12 : Math.max(0, 1-(t-5.67)/0.2); show = 1; }
      cx = lerp(P_CONFIRM.x + 40, P_CONFIRM.x, p); cy = lerp(P_CONFIRM.y - 50, P_CONFIRM.y, p);
    } else { show = 0; cx = P_CONFIRM.x; cy = P_CONFIRM.y; }

    cur.style.left = (cx - 11) + 'px';
    cur.style.top  = (cy - 11) + 'px';
    cur.style.opacity = show;
    cur.style.transform = 'scale(' + (1 - 0.2*press) + ')';

    // ---- волны нажатий ----
    let rt = -1, pt = null;
    if (t >= 1.50 && t < 1.95){ rt = (t-1.50)/0.45; pt = P_CART; }
    else if (t >= 2.85 && t < 3.30){ rt = (t-2.85)/0.45; pt = P_BAR; }
    else if (t >= 5.55 && t < 6.00){ rt = (t-5.55)/0.45; pt = P_CONFIRM; }
    if (rt >= 0 && pt){
      rip.style.left = (pt.x - 15) + 'px'; rip.style.top = (pt.y - 15) + 'px';
      rip.style.transform = 'scale(' + (0.5 + rt*2.0) + ')';
      rip.style.opacity = 0.6 * (1-rt);
    } else rip.style.opacity = 0;

    // ---- полоска загрузки перед показом успеха ----
    if (t >= 5.72 && t < 5.95){ bar.style.opacity = 1; bar.style.width = (ease((t-5.72)/0.23)*100)+'%'; }
    else if (t >= 5.95 && t < 6.10){ bar.style.opacity = 1-(t-5.95)/0.15; bar.style.width='100%'; }
    else { bar.style.opacity = 0; bar.style.width='0%'; }
  }

  window.drawFrame = drawFrame;
  let start = null, running = true;
  window.stopLoop = () => { running = false; };
  function loop(ts){
    if (!running) return;
    if (start === null) start = ts;
    drawFrame((ts - start) / 1000);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
